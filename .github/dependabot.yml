version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "**/*"
    schedule:
      interval: weekly
    groups:
      github-action-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    cooldown:
      default-days: 3
    directories:
      - "**/*"
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    groups:
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "*jest*"
          - "stylelint*"
        update-types:
          - minor
          - patch
      jest:
        patterns:
          - "*jest*"
      stylelint:
        patterns:
          - "stylelint*"
  - package-ecosystem: pip
    cooldown:
      default-days: 3
    directories:
      - "**/*"
    insecure-external-code-execution: allow
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
