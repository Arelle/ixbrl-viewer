version: 2
updates:
  - package-ecosystem: github-actions
    cooldown:
      default-days: 1
    directories:
      - /**
    schedule:
      interval: weekly
    groups:
      github-action-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    cooldown:
      default-days: 1
    directories:
      - /**
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    groups:
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "*jest*"
          - "stylelint*"
      jest:
        patterns:
          - "*jest*"
      stylelint:
        patterns:
          - "stylelint*"
    ignore:
      - dependency-name: "puppeteer-core"
        versions:
          - ">=25"
      - dependency-name: "puppeteer-screen-recorder"
        versions:
          - "3.0.5"
          - "3.0.6"
  - package-ecosystem: pip
    cooldown:
      default-days: 1
    directories:
      - /**
    insecure-external-code-execution: allow
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    groups:
      python-dependencies:
        patterns:
          - "*"
