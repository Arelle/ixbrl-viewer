[build-system]
requires = ["setuptools>=82,<85", "wheel>=0.46,<0.49", "setuptools_scm>=10.0,<11.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ixbrl-viewer"
dynamic = ['version']
readme = "README.md"
license = "Apache-2.0"
description = "The Arelle iXBRL Viewer allows iXBRL reports to be viewed interactively in a web browser."
authors = [
    {name = "arelle.org", email = "support@arelle.org"}
]
keywords = ["arelle", "plugin", "xbrl"]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: End Users/Desktop',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Operating System :: OS Independent',
    'Topic :: Text Processing :: Markup :: XML'
]
requires-python = ">=3.10"
dependencies = [
    'bottle>=0.13,<0.14',
    'lxml>=4,<7'
]
[project.optional-dependencies]
arelle = [
    'arelle_release==2.*',
]
dev = [
    'mypy==2.3.1',
    'pytest==9.1.1',
    'ruff==0.16.5',
    'types-lxml==2026.2.16',
    'typing-extensions==4.16.0',
]

# https://setuptools.pypa.io/en/latest/userguide/entry_point.html#entry-points-for-plugins
[project.entry-points."arelle.plugin"]
ixbrl-viewer = "iXBRLViewerPlugin:load_plugin_url"

[project.urls]
"Homepage" = "https://arelle.org/"
"Downloads" = "https://arelle.org/arelle/pub/"
"Documentation" = "https://arelle.org/arelle/documentation/"
"Blog" = "https://arelle.org/arelle/blog/"
"Source Code" = "https://github.com/Arelle/ixbrl-viewer"
"Bug Reports" = "https://github.com/Arelle/ixbrl-viewer/issues/"
"Support" = "https://groups.google.com/g/arelle-users/"

[tool.setuptools]
platforms = ["any"]

[tool.setuptools.packages.find]
include = ["iXBRLViewerPlugin*"]

[tool.setuptools_scm]
tag_regex = "^(?:[\\w-]+-?)?(?P<version>[vV]?\\d+(?:\\.\\d+){0,2}[^\\+]*)(?:\\+.*)?$"
write_to = "iXBRLViewerPlugin/_version.py"

[tool.ruff.lint]
# Mirrors the previous flake8 configuration (pycodestyle E/W, Pyflakes F) so
# that migrating off flake8 does not change what gets flagged. "Q"
# (flake8-quotes) is additionally enabled to enforce double quotes.
preview = true
select = ["E", "W", "F", "Q"]
ignore = [
    # indentation contains mixed spaces and tabs
    "E101",
    # indentation is not a multiple of 4
    "E111",
    # indentation is not a multiple of 4 (comment)
    "E114",
    # expected an indented block (comment)
    "E115",
    # E116 unexpected indentation (comment)
    "E116",
    # over-indented
    "E117",
    # whitespace after '('
    "E201",
    # whitespace before ')'
    "E202",
    # whitespace before ':'
    "E203",
    # whitespace before '('
    "E211",
    # multiple spaces before operator
    "E221",
    # multiple spaces after operator
    "E222",
    # missing whitespace around operator
    "E225",
    # missing whitespace around arithmetic operator
    "E226",
    # missing whitespace around bitwise or shift operator
    "E227",
    # missing whitespace around modulo operator
    "E228",
    # missing whitespace after ':'
    "E231",
    # multiple spaces after ','
    "E241",
    # unexpected spaces around keyword / parameter equals
    "E251",
    # missing whitespace around parameter equals
    "E252",
    # at least two spaces before inline comment
    "E261",
    # inline comment should start with '# '
    "E262",
    # block comment should start with '# '
    "E265",
    # too many leading '#' for block comment
    "E266",
    # multiple spaces after keyword
    "E271",
    # multiple spaces before keyword
    "E272",
    # missing whitespace after keyword
    "E275",
    # expected 1 blank line
    "E301",
    # expected 2 blank lines
    "E302",
    # too many blank lines
    "E303",
    # expected 2 blank lines after class or function definition
    "E305",
    # expected 1 blank line before a nested definition, found n
    "E306",
    # multiple imports on one line
    "E401",
    # module level import not at top of file
    "E402",
    # line too long
    "E501",
    # the backslash is redundant between brackets
    "E502",
    # multiple statements on one line (colon)
    "E701",
    # multiple statements on one line (semicolon)
    "E702",
    # statement ends with a semicolon
    "E703",
    # comparison to None should be 'if cond is not None:'
    "E711",
    # comparison to True should be 'if cond is True:' or 'if cond:'
    "E712",
    # test for membership should be 'not in'
    "E713",
    # test for object identity should be 'is not'
    "E714",
    # do not compare types, use 'isinstance()'
    "E721",
    # do not use bare 'except'
    "E722",
    # do not assign a lambda expression, use a def
    "E731",
    # ambiguous variable name
    "E741",

    # imported but unused
    "F401",
    # import 'xxx' from line 15 shadowed by loop variable
    "F402",
    # 'from xxx import *' used; unable to detect undefined names
    "F403",
    # xxx may be undefined, or defined from star imports: xxx
    "F405",
    # '...'  ... has unused named argument(s)
    "F504",
    # '...'.format(...) has unused arguments at position(s): n
    "F523",
    # '...'.format(...) is missing argument(s) for placeholder(s): n
    "F524",
    # dictionary key 'xs' repeated with different values
    "F601",
    # redefinition of unused 'xxx' from line 31
    "F811",
    # undefined name
    "F821",
    # local variable 'id' defined as a builtin referenced before assignment
    "F823",
    # local variable name is assigned to but never used
    "F841",

    # The following codes were supported but ignored by our previous flake8
    # configuration, but are not supported by ruff.
    # E121: continuation line under-indented for hanging indent
    # E122: continuation line missing indentation or outdented
    # E123: closing bracket does not match indentation of opening bracket's line
    # E124: closing bracket does not match visual indentation
    # E125: continuation line with same indent as next logical line
    # E126: continuation line over-indented for hanging indent
    # E127: continuation line over-indented for visual indent
    # E128: continuation line under-indented for visual indent
    # E129: visually indented line with same indent as next logical line
    # E131: continuation line unaligned for hanging indent
    # E704: multiple statements on one line (def)
    # W503: line break before binary operator
    # W504: line break after binary operator
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.mypy]
# Warn when a # type: ignore comment does not specify any error codes
enable_error_code = "ignore-without-code"
python_version = "3.14"
show_error_codes = true
strict = true

# --- arelle types ---
# We don't publish arelle types (yet), as they're incomplete and we don't want other devs to rely on them.
# But we should be using them ourselves to gradually improve typing in Arelle and its plugins.
[[tool.mypy.overrides]]
module = 'arelle.*'
follow_untyped_imports = true
